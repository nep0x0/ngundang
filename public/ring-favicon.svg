<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Ring band (thinner, more elegant) -->
  <ellipse cx="16" cy="22" rx="10" ry="3" fill="#FFD700" stroke="#E6B800" stroke-width="0.5"/>
  <ellipse cx="16" cy="21" rx="10" ry="3" fill="#FFF700" opacity="0.3"/>

  <!-- Diamond main body -->
  <polygon points="16,4 20,12 16,20 12,12" fill="#E8F4FD" stroke="#B8E0FF" stroke-width="0.5"/>

  <!-- Diamond facets for sparkle -->
  <polygon points="16,4 18,8 16,12 14,8" fill="#F0F8FF"/>
  <polygon points="16,4 20,12 18,8" fill="#E0F0FF"/>
  <polygon points="16,4 14,8 12,12" fill="#E0F0FF"/>

  <!-- Diamond bottom facets -->
  <polygon points="16,12 18,16 16,20 14,16" fill="#D0E8FF"/>
  <polygon points="16,12 20,12 18,16" fill="#C8E0FF"/>
  <polygon points="16,12 14,16 12,12" fill="#C8E0FF"/>

  <!-- Diamond sparkles -->
  <circle cx="15" cy="8" r="0.5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="17" cy="10" r="0.3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="14" cy="14" r="0.4" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="18" cy="16" r="0.3" fill="#FFFFFF" opacity="0.8"/>

  <!-- Ring band highlights -->
  <ellipse cx="16" cy="21" rx="8" ry="1" fill="#FFFFFF" opacity="0.4"/>
</svg>
